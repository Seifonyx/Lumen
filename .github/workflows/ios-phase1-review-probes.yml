name: Phase 1 development checks
on:
  push:
    branches: [codex/review-native-phase1, codex/phase1-ready]
    paths: ['ios/**', .github/workflows/ios-phase1-review-probes.yml]
permissions:
  contents: read
jobs:
  firebase-configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install google-auth requests
      - name: Inspect existing native Firebase configuration
        env:
          LUMEN_FIREBASE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LUMEN_ACCOUNT_CONFIG: ${{ secrets.LUMEN_IOS_ACCOUNT_CONFIG }}
          LUMEN_REGISTER_NATIVE: '1'
        run: python3 ios/scripts/inspect_firebase_setup.py
      - uses: actions/upload-artifact@v6
        with:
          name: firebase-public-configuration
          path: ${{ runner.temp }}/lumen-firebase-public/public-configuration.json
          retention-days: 1
  core:
    runs-on: macos-26
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: All core tests and regression probes
        run: swift test --package-path ios/LumenCore
  app-compile:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ios/build/DerivedData/SourcePackages
          key: native-packages-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Compile app and simulator tests
        run: |
          cd ios
          xcodegen generate
          xcodebuild build-for-testing -project Lumen.xcodeproj -scheme Lumen -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
