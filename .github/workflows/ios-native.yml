name: Native iOS

on:
  pull_request:
    paths: ['ios/**', '!ios/README.md', '!ios/sidestore-source.json', '.github/workflows/ios-native.yml']
  push:
    branches: [main]
    paths: ['ios/**', '!ios/README.md', '!ios/sidestore-source.json', '.github/workflows/ios-native.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a verified version from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: Core Swift and packaging tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Packaging and simulator selection regressions
        run: python3 -m unittest discover -s ios/tests -v
      # Swift's official image: no installer and no key-server lookups (setup-swift failed on those twice
      # on 2026-11-11).
      - name: Parse SwiftUI source before expensive simulators
        run: |
          docker run --rm -v "$PWD:/w" -w /w swift:6.2 bash -c             "find ios/Lumen ios/LumenUITests -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse"
      - name: Test native chat logic and recovery
        run: docker run --rm -v "$PWD:/w" -w /w swift:6.2 swift test --package-path ios/LumenCore

  # The simulator app and its UI tests compile once per commit, here, from a warm build cache (Firebase
  # and the other packages are rebuilt only when project.yml changes); every UI shard reuses the result.
  # macOS jobs do not wait for the Linux checks: on a free public repo that costs nothing, and verify
  # still requires every check before anything is published.
  simulator:
    name: Build the simulator app once
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      LUMEN_BUILD_ONLY: '1'
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ios/build/DerivedData
          key: native-sim-dd-v1-${{ github.sha }}
          restore-keys: native-sim-dd-v1-
      - name: Project generator
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
      - name: Build for testing
        run: bash ios/scripts/build.sh
      - name: Pack the built app and tests (keeps executable permissions)
        run: tar -C ios/build/DerivedData/Build -cf ios/build/simulator-products.tar Products
      - uses: actions/upload-artifact@v6
        with:
          name: native-build-${{ github.sha }}
          path: ios/build/simulator-products.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-build-log-${{ github.sha }}
          path: ios/build/logs/
          retention-days: 7
      # Saved from main (and whenever nothing was cached yet), so pull requests start warm without
      # spending a minute uploading the cache on every run.
      - if: always() && steps.cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v4
        with:
          path: |
            ios/build/DerivedData
            !ios/build/DerivedData/Logs
          key: native-sim-dd-v1-${{ github.sha }}

  build:
    needs: simulator
    name: iPhone ${{ matrix.profile }} / ${{ matrix.shard }} UI and Firebase
    strategy:
      fail-fast: false
      matrix:
        profile: [compact, regular]
        shard: [sync, features]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      LUMEN_QA_PROFILE: ${{ matrix.profile }}
      LUMEN_QA_SHARD: ${{ matrix.shard }}
      LUMEN_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Start booting the simulator while the build downloads
        run: |
          mkdir -p ios/build/logs
          rm -f "ios/build/prepared-$LUMEN_QA_PROFILE.json"
          cd ios
          nohup python3 scripts/prepare_simulator.py --profile "$LUMEN_QA_PROFILE" --output "build/prepared-$LUMEN_QA_PROFILE.json" > build/logs/simulator-preparation.log 2>&1 &
          echo $! > build/prep.pid
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          name: native-build-${{ github.sha }}
          path: ios/build
      - name: Unpack the built app and tests
        run: |
          mkdir -p ios/build/DerivedData/Build
          tar -C ios/build/DerivedData/Build -xf ios/build/simulator-products.tar
          rm ios/build/simulator-products.tar
      - name: Project generator
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
      - name: Run independent UI and Firebase shard
        run: bash ios/scripts/build.sh
      - name: Keep shard screenshots, provenance, checks and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-ios-${{ github.sha }}-${{ matrix.profile }}-${{ matrix.shard }}
          path: |
            ios/build/screenshots/
            ios/build/qa-devices.json
            ios/build/logs/
          retention-days: 7
          if-no-files-found: error

  package:
    name: Archive one release IPA
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ios/build/DerivedData
          key: native-rel-dd-v1-${{ github.sha }}
          restore-keys: native-rel-dd-v1-
      - name: Project generator
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
      - name: Build and validate unsigned device IPA
        run: bash ios/scripts/build_release.sh
      - name: Keep release IPA, checksum manifest and build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-ios-${{ github.sha }}-release
          path: |
            ios/build/release/
            ios/build/logs/
          retention-days: 7
          if-no-files-found: error
      - if: always() && steps.cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v4
        with:
          path: |
            ios/build/DerivedData
            !ios/build/DerivedData/Logs
          key: native-rel-dd-v1-${{ github.sha }}

  verify:
    name: Verify all four iPhone shards and release IPA
    needs: [core, build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: native-ios-${{ github.sha }}-*
          path: native-artifacts
      - name: Verify coverage, emulator data, screenshots and IPA SHA-256
        run: python3 ios/scripts/collect_artifacts.py --artifacts native-artifacts --output native-verified --source-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v6
        with:
          name: verified-native-ios-${{ github.sha }}
          path: native-verified/
          retention-days: 7

  publish:
    name: Publish native SideStore build
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v5
        with:
          name: verified-native-ios-${{ github.sha }}
          path: native-verified
      - name: Publish verified IPA and source listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ios/scripts/publish.py --artifacts native-verified
      - name: Save SideStore source when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ios/scripts/save_source.py
