name: Deploy provider relay

# Manual only (Actions tab → Run workflow). Publishes server/provider-relay to Cloudflare Workers.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  the account the relay runs in
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error title=Missing secrets::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Deploy
        working-directory: server/provider-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice title=Relay address::$url"
          echo "RELAY_URL=$url" >> "$GITHUB_ENV"
      - name: Check the image route
        # Without a key the relay must answer 401 "A provider key is required" (an old relay answers 404).
        run: |
          sleep 5
          for path in cloudflare/image cloudflare/chat/completions; do
            code=$(curl -s -o body.txt -w '%{http_code}' -X POST "$RELAY_URL/$path" -H 'origin: https://model-router.web.app' -H 'content-type: application/json' -d '{"prompt":"check"}')
            echo "::notice title=$path::HTTP $code $(head -c 200 body.txt)"
            [ "$code" = "401" ] || exit 1
          done
