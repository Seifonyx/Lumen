<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Lumen</title>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Private chat with free AI models, files, documents, spreadsheets and slides." />
    <meta property="og:title" content="Lumen" />
    <meta property="og:description" content="Private chat with free AI models, files, documents, spreadsheets and slides." />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lumen" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('mr.settings') || '{}');
        var root = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') root.dataset.theme = s.theme;
        if (s.theme === 'black') { root.dataset.theme = 'dark'; root.dataset.appearance = 'black'; }
        if (s.fontSize) root.dataset.font = s.fontSize;
        // The phone's status bar follows the chosen theme, not just the system setting.
        var bar = { light: '#f6f7f9', dark: '#0d0f12', black: '#000000' }[s.theme];
        if (bar) document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', bar); });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Signed in before: the app's frame shows at once (same markup as src/components/AppSkeleton.tsx).
      try { if (localStorage.getItem('mr.signedIn')) document.getElementById('root').innerHTML = '<div class="app app-skeleton" aria-busy="true" aria-label="Loading Lumen"><aside class="sidebar" aria-hidden="true"><div class="sk-brand"><span class="sk sk-dot"></span><span class="sk" style="width:64px"></span></div><span class="sk sk-field"></span><div class="sk-list"><span class="sk" style="width:70%"></span><span class="sk" style="width:52%"></span><span class="sk" style="width:84%"></span><span class="sk" style="width:46%"></span><span class="sk" style="width:62%"></span><span class="sk" style="width:74%"></span><span class="sk" style="width:40%"></span></div></aside><main class="main is-empty" aria-hidden="true"><header class="topbar"><span class="sk sk-dot"></span><span class="sk" style="width:110px"></span></header><div class="conversation-area"><div class="messages"><div class="empty sk-welcome"><span class="sk sk-star"></span><span class="sk sk-title"></span></div></div></div><div class="composer-wrap"><div class="composer sk-composer"></div></div></main></div>'; } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
