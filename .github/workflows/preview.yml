name: Preview

on:
  workflow_dispatch:
    inputs:
      presentation:
        description: Ordinary is the current production presentation. Choose canvas to preview Canvas.
        type: choice
        options: [ordinary, canvas]
        default: ordinary

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build (${{ inputs.presentation }} presentation)
        run: npm run build
        env:
          LUMEN_CANVAS: ${{ inputs.presentation == 'canvas' && '1' || '0' }}
      - name: Preview channel lives on the old site (its address is already set up for sign-in)
        run: |
          sed -i 's/"site": "lumen-chat"/"site": "model-router"/' firebase.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: the-model-router
          channelId: dev
          # Pinned like deploy.yml: firebase-tools 15.34.1 fails this service account with serviceusage.services.get.
          firebaseToolsVersion: 15.34.0
          expires: 30d
