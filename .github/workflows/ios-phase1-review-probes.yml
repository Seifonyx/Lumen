name: Phase 1 development checks
on:
  push:
    branches: [codex/review-native-phase1, codex/phase1-ready]
    paths: ['ios/**', .github/workflows/ios-phase1-review-probes.yml]
permissions:
  contents: read
concurrency:
  group: phase1-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-qa:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ios/build/DerivedData/SourcePackages
          key: native-packages-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: python3 -m unittest discover -s ios/tests -v
      - name: Build, connected UI journeys, screenshots and unsigned IPA
        run: bash ios/scripts/build.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase1-qa-${{ github.sha }}
          path: |
            ios/build/release/
            ios/build/screenshots/
            ios/build/qa-devices.json
            ios/build/logs/
          retention-days: 2
          if-no-files-found: error
