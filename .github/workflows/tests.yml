name: Tests

# The repository is private, so GitHub's free plan gives a limited number of Actions minutes a month.
# Keep runs cheap: skip changes that only touch documentation, cancel superseded runs, cache downloads,
# and run independent in-app tests side by side (scripts/test-e2e.mjs) instead of on extra machines.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.impeccable/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.impeccable/**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, build, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  in-app:
    name: In-app tests (Chromium + Firebase emulators)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.30.2
      - uses: actions/cache@v5
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Browser
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - run: npm run build
      - run: npm run test:e2e:ci
      - name: Keep screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: tests/e2e/out
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    name: Safari engine (WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - id: webkit_build
        run: npm run build
      - name: Welcome and responsive layout in WebKit
        if: ${{ !cancelled() && steps.webkit_build.outcome == 'success' }}
        run: npm run test:e2e -- welcome layout
        env:
          MR_WEBKIT: '1'
      - name: WebKit tab bar interactions
        if: ${{ !cancelled() && steps.webkit_build.outcome == 'success' }}
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js preview --port 5190 --strictPort > /tmp/vite-webkit.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:5190/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:5190/ > /dev/null
          node tests/webkit/tabbar.cjs
      - name: Hub actions, motion and long-chat navigation in WebKit
        if: ${{ !cancelled() && steps.webkit_build.outcome == 'success' }}
        run: npm run test:e2e -- message-navigation hub-actions motion-controls motion-chat chat-menu attachment-motion visual-animations context-recovery layout-builder selection-boundaries fast-route auto-intelligence catalog-lifecycle selection-policy routing-priorities layout-policies model-declarations comparison-recovery declared-background
        env:
          MR_WEBKIT: '1'
          # This suite seeds its own preview account and mocks provider requests.
          MR_TEST_URL: http://localhost:5190/
      - name: Keep WebKit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webkit-evidence
          include-hidden-files: true
          path: |
            tests/e2e/out/webkit-*.png
            .impeccable/review/*webkit*.png
          if-no-files-found: ignore
          retention-days: 7
