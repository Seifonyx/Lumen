name: Deploy

on:
  workflow_dispatch:
    inputs:
      presentation:
        description: Ordinary is the current production presentation (and the rollback). Choose canvas only to ship Canvas on purpose.
        type: choice
        options: [ordinary, canvas]
        default: ordinary

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build (${{ inputs.presentation }} presentation)
        run: npm run build
        env:
          LUMEN_CANVAS: ${{ inputs.presentation == 'canvas' && '1' || '0' }}
      - name: Deploy live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: the-model-router
          channelId: live
      - name: Preview channel lives on the old site (its address is already set up for sign-in)
        run: |
          sed -i 's/"site": "lumen-chat"/"site": "model-router"/' firebase.json
      - name: Update preview to this release
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: the-model-router
          channelId: dev
          expires: 30d
