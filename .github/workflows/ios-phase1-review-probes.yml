name: Phase 1 development checks
on:
  push:
    branches: [codex/review-native-phase1, codex/phase1-ready]
    paths: ['ios/LumenCore/**', ios/scripts/inspect_firebase_setup.py, .github/workflows/ios-phase1-review-probes.yml]
permissions:
  contents: read
jobs:
  firebase-configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install google-auth requests
      - name: Inspect existing native Firebase configuration
        env:
          LUMEN_FIREBASE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LUMEN_ACCOUNT_CONFIG: ${{ secrets.LUMEN_IOS_ACCOUNT_CONFIG }}
          LUMEN_REGISTER_NATIVE: '1'
        run: python3 ios/scripts/inspect_firebase_setup.py
      - uses: actions/upload-artifact@v6
        with:
          name: firebase-public-configuration
          path: ${{ runner.temp }}/lumen-firebase-public/public-configuration.json
          retention-days: 1
  probes:
    runs-on: macos-26
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Existing core tests
        run: swift test --package-path ios/LumenCore --filter 'AuthEngineTests|ChatEngineTests|DraftStateTests'
      - name: Provider routing probe
        id: routing
        continue-on-error: true
        run: swift test --package-path ios/LumenCore --filter providerSelectionRoutesToTheSelectedService
      - name: Mid-stream relaunch probe
        id: persistence
        continue-on-error: true
        run: swift test --package-path ios/LumenCore --filter submittedConversationSurvivesRelaunchBeforeTheReplyFinishes
      - name: New chat during streaming probe
        id: cancellation
        continue-on-error: true
        run: swift test --package-path ios/LumenCore --filter switchingChatsDuringStreamingKeepsTheNewChatSafe
      - name: Report review probes
        if: always()
        env:
          ROUTING: ${{ steps.routing.outcome }}
          PERSISTENCE: ${{ steps.persistence.outcome }}
          CANCELLATION: ${{ steps.cancellation.outcome }}
        run: |
          echo "Provider routing: $ROUTING"
          echo "Mid-stream relaunch: $PERSISTENCE"
          echo "New chat during streaming: $CANCELLATION"
          test "$ROUTING" = success && test "$PERSISTENCE" = success && test "$CANCELLATION" = success
