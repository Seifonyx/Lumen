name: Tests

# The repository is private, so GitHub's free plan gives a limited number of Actions minutes a month.
# Keep runs cheap: skip changes that only touch documentation, cancel superseded runs, cache downloads,
# and run independent in-app tests side by side (scripts/test-e2e.mjs) instead of on extra machines.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.impeccable/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.impeccable/**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  in-app:
    name: In-app tests (Chromium + Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.30.2
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Browser
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - run: npm run build
      - run: npm run test:e2e:ci
      - name: Keep screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/out
          if-no-files-found: ignore
          retention-days: 7
